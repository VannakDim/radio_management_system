name: mobile_app
description: "A new Flutter project for Radio Management System Mobile Client."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Network
  dio: ^5.4.0

  # Secure & Local Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Utilities & Styling
  google_fonts: ^6.1.0
  intl: ^0.19.0
  path_provider: ^2.1.1

  # QR/Barcode Scanner
  mobile_scanner: ^5.0.0

  # Image Picker
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
